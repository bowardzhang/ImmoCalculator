        - generic [ref=e315]:
          - heading "📖 指标解释" [level=3] [ref=e316]
          - generic [ref=e317]:
            - generic [ref=e318]:
              - generic [ref=e319]: 累计净现金流 (Kum. Cashflow)
              - paragraph [ref=e322]: 每年所有现金流入减去流出的累计值。
              - paragraph [ref=e323]: 起始为负（首付支出），之后每年叠加：租金收入 − 贷款本息 − 维修 − Hausgeld − Grundsteuer − 保险 − 税费。
              - paragraph [ref=e324]: 转正意味着累计现金回流已覆盖初始投入。
            - generic [ref=e325]:
              - generic [ref=e326]: 房屋净值 (Eigenkapital)
              - paragraph [ref=e329]: 当前房价 − 剩余贷款。
              - paragraph [ref=e330]: 反映如果此时卖掉房产并还清贷款后能拿到的钱。
              - paragraph [ref=e331]: 随房价增值和贷款还本逐年增加。
            - generic [ref=e332]:
              - generic [ref=e333]: 剩余贷款 (Restschuld)
              - paragraph [ref=e336]: 尚未还清的银行贷款余额。
              - paragraph [ref=e337]: 每年递减 = 上年余额 − 当年本金偿还 (Tilgung)。
              - paragraph [ref=e338]: 贷款还清后归零，此时月供停止，现金流大幅改善。
            - generic [ref=e339]:
              - generic [ref=e340]: 总净资产 (Gesamtvermögen)
              - paragraph [ref=e343]: 房屋净值 + 累计净现金流。
              - paragraph [ref=e344]: = 房价 − 剩余贷款 + 首付支出 + 历年净现金流。
              - paragraph [ref=e345]: 这是衡量投资总回报的核心指标：你的全部财富（房产权益 + 现金）。
            - generic [ref=e346]:
              - generic [ref=e347]: 年化 ROI
              - paragraph [ref=e350]: 简化年化复利回报率。公式：
              - generic [ref=e351]:
                - text: 总利润 ÷ 用户总投入 × 100 = 简单 ROI (%)年化 ROI = (1 + 简单ROI/100)
                - superscript [ref=e352]: 1/年数
                - text: − 1 × 100%
              - paragraph [ref=e353]: 其中「用户总投入」= 首付 + 历年所有负现金流补亏之和。「总利润」= 终期净资产 − 初始净资产（= −交易成本）。
              - paragraph [ref=e354]: 这是一个简化算法（非 XIRR），把所有投入视为初始投入，用复利公式反推年化回报。
